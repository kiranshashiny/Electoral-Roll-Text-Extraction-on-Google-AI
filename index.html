<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electoral Roll PDF Parser & CSV Extractor</title>
    <meta name="description" content="Automated electoral roll PDF parser that compiles card data, extracts voter records into individual dataset CSVs, and streams live compilation status and console outputs." />
    <meta property="og:title" content="Electoral Roll PDF Parser & CSV Extractor" />
    <meta property="og:description" content="Automated electoral roll PDF parser that compiles card data, extracts voter records into individual dataset CSVs, and streams live compilation status and console outputs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Ignore Vite HMR WebSocket errors in AI Studio iframe environment
      window.addEventListener('error', function(event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') ||
           event.message.includes('createWebSocketModuleRunnerTransport') ||
           event.message.includes('@vite/client'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason ? String(event.reason.message || event.reason) : '';
        if (
          reason.includes('WebSocket') ||
          reason.includes('createWebSocketModuleRunnerTransport') ||
          reason.includes('@vite/client')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
